name: metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # once a day
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sushil113
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          filename: github-metrics.svg